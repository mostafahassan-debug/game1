<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة بناء وإعراب الأفعال</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .game-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        h1 {
            color: #1e3c72;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            border: 2px solid #2a5298;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        button.start-btn, button.next-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }
        button.start-btn:hover, button.next-btn:hover {
            background: #219150;
        }
        .question-box {
            background: #f4f7f6;
            border-right: 6px solid #2a5298;
            padding: 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            padding: 14px;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: right;
        }
        .option-btn:hover {
            border-color: #2a5298;
            background: #f0f4f9;
        }
        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }
        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: #555;
        }
        .hidden {
            display: none;
        }
        .feedback {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        .status-msg {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- شاشة البداية -->
    <div id="start-screen">
        <h1>لعبة إعراب وبناء الأفعال 🎮</h1>
        <p>اختبر معلوماتك في الفعل الماضي والمضارع (العلامات الأصلية والفرعية)</p>
        <div class="input-group">
            <input type="text" id="player-name" placeholder="أدخل اسمك الثلاثي للبدء..." required>
        </div>
        <button class="start-btn" onclick="startGame()">ابدأ اللعب</button>
    </div>

    <!-- شاشة اللعبة -->
    <div id="game-screen" class="hidden">
        <div class="score-board">
            <span>اللاعب: <span id="display-name"></span></span>
            <span>النتيجة: <span id="score">0</span> / <span id="total-q"></span></span>
        </div>
        <div class="question-box" id="question-text">جاري تحميل السؤال...</div>
        <div class="options-grid" id="options-container"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-btn" class="next-btn hidden" onclick="nextQuestion()">السؤال التالي</button>
    </div>

    <!-- شاشة النهاية -->
    <div id="end-screen" class="hidden">
        <h1>أحسنت! أتممت الاختبار 🎉</h1>
        <p style="font-size: 20px;">درجتك النهائية هي: <strong id="final-score" style="color: #27ae60;"></strong></p>
        <div id="firebase-status" class="status-msg">جاري حفظ النتيجة في Firebase...</div>
        <button class="start-btn" onclick="location.reload()">إعادة اللعب 🔄</button>
    </div>
</div>

<script>
    // رابط Firebase المخصص للعبة
    const FIREBASE_URL = "https://game2-c9a8e-default-rtdb.firebaseio.com/";

    // أسئلة الدرس (بناء الماضي والمضارع + علامات الإعراب الأصلية والفرعية)
    const questions = [
        {
            q: "الولدُ **كَتَبَ** الدرسَ بخطٍ جميل.",
            options: ["فعل ماضٍ مبني على الفتح", "فعل مضارع مرفوع بالضمة", "فعل ماضٍ مبني على السكون"],
            answer: 0
        },
        {
            q: "الطالباتُ **يَكْتُبْنَ** الواجبَ باتقان.",
            options: ["فعل مضارع مرفوع بثبوت النون", "فعل مضارع مبني على السكون لاتصاله بنون النسوة", "فعل مضارع منصوب بالفتحة"],
            answer: 1
        },
        {
            q: "المعلمون **يَجْتَهِدُونَ** في عملهم.",
            options: ["فعل مضارع مرفوع بالضمة (علامة أصلية)", "فعل مضارع مرفوع بثبوت النون (علامة فرعية)", "فعل ماضٍ مبني على الواو"],
            answer: 1
        },
        {
            q: "الطَلاّبُ لَنْ **يَهْمِلُوا** دروسهم.",
            options: ["فعل مضارع مجزوم بالسكون (علامة أصلية)", "فعل مضارع منصوب بحذف النون (علامة فرعية)", "فعل مضارع مبني على الضم"],
            answer: 1
        },
        {
            q: "لا **تَدْعُ** إلا اللهَ وحده.",
            options: ["فعل مضارع مجزوم بحذف حرف العلة (علامة فرعية)", "فعل مضارع مجزوم بالسكون (علامة أصلية)", "فعل مضارع مبني على حذف النون"],
            answer: 0
        },
        {
            q: "العلمُ **يَرْفَعُ** شَأْنَ صاحِبِهِ.",
            options: ["فعل مضارع مرفوع بالضمة (علامة أصلية)", "فعل مضارع مبني على الفتح", "فعل مضارع مرفوع بثبوت النون"],
            answer: 0
        },
        {
            q: "لَمْ **يَتَأَخَّرْ** عليٌّ عَنِ المَوْعِدِ.",
            options: ["فعل مضارع مجزوم بالسكون (علامة أصلية)", "فعل مضارع مجزوم بحذف حرف العلة", "فعل ماضٍ مبني على السكون"],
            answer: 0
        }
    ];

    let currentQ = 0;
    let score = 0;
    let playerName = "";

    function startGame() {
        const input = document.getElementById("player-name").value.trim();
        if (!input) {
            alert("يرجى كتابة اسمك أولاً!");
            return;
        }
        playerName = input;
        document.getElementById("display-name").innerText = playerName;
        document.getElementById("total-q").innerText = questions.length;
        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        loadQuestion();
    }

    function loadQuestion() {
        const qData = questions[currentQ];
        document.getElementById("question-text").innerHTML = qData.q;
        document.getElementById("feedback").innerText = "";
        document.getElementById("next-btn").classList.add("hidden");
        
        const container = document.getElementById("options-container");
        container.innerHTML = "";

        qData.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx, btn);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selectedIdx, btnElement) {
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(b => b.disabled = true); // تعطيل بقية الأزرار

        const correctIdx = questions[currentQ].answer;
        if (selectedIdx === correctIdx) {
            btnElement.classList.add("correct");
            document.getElementById("feedback").innerText = "إجابة صحيحة! 👏";
            document.getElementById("feedback").style.color = "#28a745";
            score++;
            document.getElementById("score").innerText = score;
        } else {
            btnElement.classList.add("wrong");
            buttons[correctIdx].classList.add("correct");
            document.getElementById("feedback").innerText = "إجابة خاطئة! ❌";
            document.getElementById("feedback").style.color = "#dc3545";
        }

        document.getElementById("next-btn").classList.remove("hidden");
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        document.getElementById("game-screen").classList.add("hidden");
        document.getElementById("end-screen").classList.remove("hidden");
        document.getElementById("final-score").innerText = `${score} من ${questions.length}`;

        // إرسال البيانات إلى Firebase
        saveToFirebase();
    }

    function saveToFirebase() {
        const statusEl = document.getElementById("firebase-status");
        const payload = {
            name: playerName,
            score: score,
            total: questions.length,
            timestamp: new Date().toISOString()
        };

        // استخدام REST API الخاص بقاعدة البيانات
        fetch(`${FIREBASE_URL}/scores.json`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => {
            if (res.ok) {
                statusEl.innerText = "تم حفظ النتيجة في قاعدة البيانات بنجاح! ✅";
                statusEl.style.color = "#27ae60";
            } else {
                throw new Error();
            }
        })
        .catch(err => {
            statusEl.innerText = "تعذر حفظ النتيجة تلقائياً. تأكد من إعدادات الحماية في Firebase.";
            statusEl.style.color = "#dc3545";
        });
    }
</script>

</body>
</html>
